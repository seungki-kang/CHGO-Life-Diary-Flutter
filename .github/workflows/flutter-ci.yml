name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and validate contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - name: Install dependencies
        run: |
          flutter pub get
          python -m pip install jsonschema==4.26.0
      - name: Analyze
        run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage
      - name: Validate canonical and storage contracts
        run: python tools/contract/validate_life_diary_contract.py
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 7
